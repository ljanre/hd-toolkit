<title id="title">CRCP with HMA shoulders — schematic plan</title><desc id="desc">Continuous longitudinal reinforcement runs through transverse cracks. Asphalt shoulders border the two-lane concrete carriageway. This plan is schematic and does not specify reinforcement sizes or spacing.</desc>
